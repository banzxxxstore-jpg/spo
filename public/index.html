<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Downloader</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a10;
      color: #f1f0fb;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2rem;
    }

    .header-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #2d1b69;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-icon svg {
      width: 22px;
      height: 22px;
      stroke: #a78bfa;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
      color: #f1f0fb;
    }

    .header p {
      font-size: 13px;
      color: #6b7280;
      margin-top: 2px;
    }

    /* Input area */
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    input[type="url"] {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #1e1e2e;
      background: #12121a;
      color: #f1f0fb;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="url"]::placeholder { color: #4b5563; }
    input[type="url"]:focus { border-color: #7c3aed; }

    button#fetch-btn {
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid #7c3aed;
      background: #7c3aed;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button#fetch-btn:hover { background: #6d28d9; }
    button#fetch-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    button#fetch-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Status */
    #status {
      display: none;
      font-size: 13px;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 12px;
      align-items: center;
      gap: 8px;
    }

    #status svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    #status.loading { background: #12121a; color: #9ca3af; border: 1px solid #1e1e2e; display: flex; }
    #status.error   { background: #1f0a0a; color: #f87171; border: 1px solid #3f1111; display: flex; }
    #status.success { background: #0a1f14; color: #4ade80; border: 1px solid #0f3320; display: flex; }

    .spinner {
      width: 14px;
      height: 14px;
      border: 1.5px solid #374151;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* CORS note */
    #cors-note {
      display: none;
      font-size: 12px;
      color: #6b7280;
      background: #12121a;
      border: 1px solid #1e1e2e;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    #cors-note strong { color: #9ca3af; }

    #cors-note code {
      background: #1e1e2e;
      padding: 1px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
    }

    /* Result card */
    #result-card {
      display: none;
      border: 1px solid #1e1e2e;
      border-radius: 12px;
      overflow: hidden;
    }

    .cover-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: 260px;
      overflow: hidden;
      background: #12121a;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .cover-placeholder svg {
      width: 64px;
      height: 64px;
      stroke: #374151;
      fill: none;
      stroke-width: 1.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .meta {
      padding: 1rem 1.25rem;
      background: #12121a;
      border-top: 1px solid #1e1e2e;
    }

    .meta-title {
      font-size: 16px;
      font-weight: 600;
      color: #f1f0fb;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta-artist {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta-album {
      font-size: 12px;
      color: #4b5563;
      margin-bottom: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #dl-btn {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 8px;
      border: 1px solid #7c3aed;
      background: transparent;
      color: #a78bfa;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s;
    }

    #dl-btn:hover { background: #1e0a3a; }

    #dl-btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #duration {
      display: none;
      font-size: 12px;
      color: #4b5563;
      margin-left: auto;
      align-items: center;
      gap: 4px;
    }

    #duration svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Footer */
    .footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 11px;
      color: #374151;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <div class="header-icon">
        <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <div>
        <h1>Spotify Downloader</h1>
        <p>Tempel link Spotify track untuk unduh audio</p>
      </div>
    </div>

    <div class="input-row">
      <input type="url" id="url-input" placeholder="https://open.spotify.com/track/..." autocomplete="off" spellcheck="false" />
      <button id="fetch-btn" onclick="handleFetch()">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Cari track
      </button>
    </div>

    <div id="status"></div>



    <div id="result-card">
      <div class="cover-wrap">
        <img id="cover-img" alt="Cover album" />
        <div class="cover-placeholder" id="cover-placeholder">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="9" x2="12" y2="2"/></svg>
        </div>
      </div>
      <div class="meta">
        <p class="meta-title" id="meta-title">—</p>
        <p class="meta-artist" id="meta-artist">—</p>
        <p class="meta-album" id="meta-album">—</p>
        <div class="meta-actions">
          <a id="dl-btn" href="#" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Unduh audio
          </a>
          <span id="duration">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span id="dur-val">—</span>
          </span>
        </div>
      </div>
    </div>

    <div class="footer">Hanya untuk keperluan pribadi &bull; Patuhi hak cipta musik</div>

  </div>

  <script>
    const urlInput   = document.getElementById('url-input');
    const fetchBtn   = document.getElementById('fetch-btn');
    const statusEl   = document.getElementById('status');
    const resultCard = document.getElementById('result-card');
    const coverImg   = document.getElementById('cover-img');
    const coverPh    = document.getElementById('cover-placeholder');
    const dlBtn      = document.getElementById('dl-btn');
    const durationEl = document.getElementById('duration');

    urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleFetch(); });

    function showStatus(type, html) {
      statusEl.className = type;
      statusEl.innerHTML = html;
      statusEl.style.display = 'flex';
    }

    function hideStatus() { statusEl.style.display = 'none'; }

    function formatMs(ms) {
      if (!ms) return null;
      const s = Math.floor(ms / 1000);
      return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    }

    function showResult(data) {
      document.getElementById('meta-title').textContent  = data.title  || 'Tidak diketahui';
      document.getElementById('meta-artist').textContent = data.artist || '—';
      document.getElementById('meta-album').textContent  = data.album  || '—';

      if (data.cover_url) {
        coverImg.src = data.cover_url;
        coverImg.style.display = 'block';
        coverPh.style.display = 'none';
      } else {
        coverImg.style.display = 'none';
        coverPh.style.display = 'flex';
      }

      const dur = formatMs(data.duration);
      if (dur) {
        document.getElementById('dur-val').textContent = dur;
        durationEl.style.display = 'flex';
      }

      if (data.download_url) {
        dlBtn.href = data.download_url;
        dlBtn.setAttribute('download', (data.title || 'track') + '.mp3');
        dlBtn.style.display = 'flex';
      }

      resultCard.style.display = 'block';
    }

    async function handleFetch() {
      const url = urlInput.value.trim();

      if (!url) {
        showStatus('error', '<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Masukkan link Spotify terlebih dahulu.');
        return;
      }

      if (!url.includes('spotify.com/track/')) {
        showStatus('error', '<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Link tidak valid. Gunakan link spotify.com/track/...');
        return;
      }

      resultCard.style.display = 'none';
      dlBtn.style.display = 'none';
      durationEl.style.display = 'none';
      fetchBtn.disabled = true;

      showStatus('loading', '<div class="spinner"></div> Mengambil info track...');

      try {
        const res = await fetch('/api/spotify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        if (!res.ok) throw new Error('Server error: ' + res.status);

        const json = await res.json();
        const meta = json.data?.metadata;

        if (meta?.download) {
          hideStatus();
          showResult({
            title:        meta.name,
            artist:       meta.artist,
            album:        meta.album,
            duration:     meta.duration,
            cover_url:    meta.image,
            download_url: meta.download
          });
        } else {
          showStatus('error', '<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Track tidak ditemukan. Coba link lain.');
        }
      } catch (e) {
        const isCors = e instanceof TypeError;
        if (isCors) {
          showStatus('error', '<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Koneksi gagal. Pastikan server.js sudah berjalan.');
        } else {
          showStatus('error', '<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Gagal: ' + e.message);
        }
      } finally {
        fetchBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
